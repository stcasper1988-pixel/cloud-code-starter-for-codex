name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run security audit
        run: bash scripts/security-audit.sh

  hook-policy:
    name: Hook policy (${{ matrix.mode }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            mode: bash
          - os: windows-latest
            mode: powershell
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        if: matrix.mode == 'bash'
        with:
          node-version: "22"

      - name: Run hook policy regression tests
        run: python scripts/test-hook-policy.py ${{ matrix.mode }}
